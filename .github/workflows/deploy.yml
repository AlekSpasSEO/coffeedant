name: Deploy Astro site to Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci || npm install
      - name: Test localization routing, factual safeguards and regional commerce
        run: npm run test:localization
      - name: Test Amazon deal discounts, availability and expiry
        run: npm run test:deals
      - name: Test product-specific review prose and similarity safeguards
        run: npm run test:review-originality
      - name: Build Cloudflare target
        run: CF_PAGES=1 npm run build
      - name: Validate sitemaps, metadata, schema and accessible media
        run: npm run test:seo && npm run validate:seo
      - name: Validate complete brand navigation
        run: CF_PAGES=1 npm run validate:brand-navigation
      - name: Validate sitewide analytics and consent
        run: npm run test:analytics-policy && npm run validate:analytics
      - name: Validate Cloudflare Journal
        run: npm run validate:journal
      - name: Validate Cloudflare modern reviews
        run: CF_PAGES=1 node scripts/validate-review-batch.mjs
      - name: Validate video library, provenance and new product coverage
        run: npm run validate:videos
      - name: Validate Cloudflare review titles, openings and body originality
        run: npm run validate:review-originality
      - name: Validate Cloudflare legacy migration
        run: CF_PAGES=1 node scripts/validate-legacy-migration.mjs
      - name: Validate Cloudflare Amazon banners
        run: npm run validate:amazon-banners
      - name: Validate Cloudflare bean reviews
        run: CF_PAGES=1 npm run validate:beans
      - name: Validate Cloudflare finder coverage and hardware filters
        run: CF_PAGES=1 npm run validate:coffee-finder
      - name: Validate Amazon catalog and Finder purchase links
        run: npm run validate:amazon-catalog
      - name: Build regional editions or retain their release while translations are pending
        shell: bash
        run: |
          set +e
          node scripts/localization/bundle.mjs --check
          regional_status=$?
          if [ "$regional_status" -eq 0 ]; then
            npm run build:regions
            regional_status=$?
          fi
          set -e
          if [ "$regional_status" -eq 42 ]; then
            echo "::notice::Regional publication deferred: current translations are incomplete. Existing regional pages stay on the previous successful deployment; English checks continue."
          elif [ "$regional_status" -ne 0 ]; then
            exit "$regional_status"
          fi
      - name: Preserve regional publication readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-publication-readiness
          path: .localization/regional-publication.json
          if-no-files-found: ignore
      - name: Build GitHub Pages target
        run: npm run build
      - name: Validate GitHub Pages SEO parity
        run: npm run validate:seo
      - name: Validate GitHub Pages brand navigation
        run: npm run validate:brand-navigation
      - name: Validate modern reviews
        run: node scripts/validate-review-batch.mjs
      - name: Validate GitHub Pages review titles, openings and body originality
        run: npm run validate:review-originality
      - name: Validate GitHub Pages Journal
        run: npm run validate:journal
      - name: Validate legacy migration
        run: node scripts/validate-legacy-migration.mjs
      - name: Validate GitHub Pages Amazon banners
        run: npm run validate:amazon-banners
      - name: Validate GitHub Pages bean reviews
        run: npm run validate:beans
      - name: Validate GitHub Pages finder and internal links
        run: npm run validate:coffee-finder
      - name: Record canonical article parity
        run: npm run audit:article-parity
      - name: Print upgrade queue
        run: npm run plan:upgrades -- --size=5
      - name: Check patch formatting
        run: git diff --check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
