name: Refresh Amazon offers

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-commerce-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch current Amazon prices and availability
        id: offers
        continue-on-error: true
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
        run: npm run update:amazon-offers
      - name: Recheck prices, images and expiry for the current Friday deals
        id: deals
        continue-on-error: true
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
        run: npm run refresh:amazon-deals
      - name: Refresh configured regional offers using the existing Amazon credentials
        id: regional
        continue-on-error: true
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_VERSION }}
        run: npm run localization:refresh-offers
      - name: Verify the production build
        run: CF_PAGES=1 npm run build
      - name: Publish refreshed offer data
        run: |
          git add src/data/amazon-offers.json
          git add src/data/amazon-deals.json
          if [ -d localization/offers ]; then git add localization/offers; fi
          if git diff --cached --quiet; then
            echo "Amazon offer data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Cloudflare must deploy refreshed prices; do not add a CI-skip marker.
          git commit -m "chore: refresh Amazon offers"
          git pull --rebase origin main
          git push
      - name: Report incomplete refreshes without discarding successful updates
        if: steps.offers.outcome == 'failure' || steps.deals.outcome == 'failure' || steps.regional.outcome == 'failure'
        run: |
          echo '::error::One or more Amazon refreshes failed. Successful updates were preserved. Check the failed step for the API reason; the deals page falls back to reviewed products when prices expire.'
          exit 1
