<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="warm-up-title warm-up-description">
  <title id="warm-up-title">Lelit Elizabeth PL92T first-shot temperature after 20 and 25 minutes</title>
  <desc id="warm-up-description">Kaffeemacher's September 2026 retest measured the first shot at 84.8 degrees Celsius after 20 minutes and 90.7 after 25 minutes. The brew temperature was set to 94 degrees Celsius. These readings came from one previously used PL92T.</desc>
  <rect width="800" height="360" rx="16" fill="#f7f2e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18392e">
    <text x="40" y="49" font-size="33" font-weight="700">First-shot temperature</text>
    <text x="40" y="78" fill="#426053" font-size="22">Kaffeemacher · September 2026 retest</text>

    <g fill="none" stroke="#b2c0b0" stroke-width="2">
      <path d="M96 172H748"/>
      <path d="M96 267H748"/>
    </g>
    <g fill="#426053" font-size="20" text-anchor="end">
      <text x="83" y="178">90°C</text>
      <text x="83" y="273">80°C</text>
    </g>
    <path d="M96 134H748" stroke="#527466" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="748" y="121" fill="#426053" font-size="22" font-weight="700" text-anchor="end">94°C setpoint</text>

    <g fill="#1b5d46" stroke="#f7f2e7" stroke-width="3">
      <circle cx="249" cy="221.4" r="12"/>
      <circle cx="543" cy="165.4" r="12"/>
    </g>
    <g font-size="29" font-weight="700">
      <text x="268" y="230">84.8°C</text>
      <text x="562" y="174">90.7°C</text>
    </g>
    <g font-size="24" font-weight="700" text-anchor="middle">
      <text x="249" y="298">20 min preheat</text>
      <text x="543" y="298">25 min preheat</text>
    </g>
    <text x="40" y="338" fill="#426053" font-size="21">Measurements from one previously used PL92T.</text>
  </g>
</svg>
